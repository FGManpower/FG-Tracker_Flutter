  image_cropper: ^12.2.1
  liquid_pull_to_refresh: ^3.0.1
  socket_io_client: ^3.1.1
  geolocator: ^13.0.4
  location: ^8.0.0
  google_maps_flutter: ^2.12.1
  flutter_polyline_points: ^2.0.0
  http: ^1.3.0
  pretty_qr_code: ^3.4.0
  share_plus: ^10.1.4
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  open_file: ^3.5.10
  otp_autofill: ^4.1.0
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.3.0
  vector_math: ^2.1.4
  flutter_compass: ^0.8.1
  geocoding: ^4.0.0
  camera: ^0.10.5+7
  cloud_firestore: ^5.6.11
  googleapis_auth: ^2.0.0
  shorebird_code_push: ^2.0.3
  flutter_ringtone_player: ^4.0.0+4
  flutter_webrtc: ^1.2.0
  card_swiper: ^3.0.1
  archive: ^4.0.7
  app_links: ^6.4.0
  flutter_sound: ^9.30.0
  audio_streamer: ^4.3.0
  system_alert_window: ^2.0.7
  android_intent_plus: ^6.0.0
  audio_session: ^0.2.2
  wakelock_plus: ^1.4.0
  record: ^6.2.0
  just_audio: ^0.10.5
  waveform_flutter: ^1.2.0
  connectycube_flutter_call_kit: ^2.8.2
  flutter_callkit_incoming: ^3.0.0
  mobile_scanner: ^7.2.0
  flutter_animarker: ^3.2.0
  gal: ^2.3.0
  fluster: ^1.2.0


dev_dependencies:
  build_runner: ^2.4.6
  #flutter packages pub run build_runner build
  flutter_gen_runner: ^5.3.1
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"



flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/music/
    - shorebird.yaml
    - assets/map_theme/dark_map.json

  fonts:
    - family: InterBlack
      fonts:
        - asset: assets/fonts/Inter-Black.ttf

    - family: InterBold
      fonts:
        - asset: assets/fonts/Inter-Bold.ttf

    - family: InterExtraBold
      fonts:
        - asset: assets/fonts/Inter-ExtraBold.ttf

    - family: InterExtraLight
      fonts:
        - asset: assets/fonts/Inter-ExtraLight.ttf

    - family: InterLight
      fonts:
        - asset: assets/fonts/Inter-Light.ttf

    - family: InterMedium
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf

    - family: InterRegular
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf

    - family: InterSemiBold
      fonts:
        - asset: assets/fonts/Inter-SemiBold.ttf

    - family: InterThin
      fonts:
        - asset: assets/fonts/Inter-Thin.ttf